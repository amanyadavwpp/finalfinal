<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CA Final Lecture Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#6b7280;--bd:#e5e7eb;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--tx:#eceef2;--mu:#9aa3b2;--bd:#2a2f3a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 14px;white-space:nowrap;font:inherit;cursor:pointer}
.tab.on{background:var(--c);border-color:var(--c);color:#fff}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.big{font-size:28px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--c);transition:width .2s}
.ch{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:8px 0;overflow:hidden}
.hd{display:flex;gap:10px;align-items:center;padding:12px;cursor:pointer}
.hd b{flex:1;font-weight:600}.n{color:var(--mu);min-width:22px}
.ct{font-size:13px;color:var(--mu);white-space:nowrap}
.ch.full .ct{color:#16a34a;font-weight:600}
.ls{display:none;padding:0 12px 12px}.ch.open .ls{display:block}
.l{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer}
.l input{width:20px;height:20px;accent-color:var(--c)}.l span{flex:1}.l.d span{text-decoration:line-through;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
button.s{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
.mini{font-size:12px;padding:5px 9px}
</style></head><body><main>
<h1>CA Final Lecture Tracker</h1>
<div class="tabs" id="tabs"></div>
<div id="app"></div>
<div class="row">
<button class="s" id="exp">Export backup</button>
<button class="s" id="imp">Import backup</button>
<button class="s" id="rst">Reset all</button>
<input type="file" id="file" accept="application/json" hidden>
</div>
<p class="mu">Progress saves in this browser only. Use Export to back up or move to another device.</p>
</main>

const KEY="ca-final-tracker-v1";
let S,cur=0,open={};
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S))S=SEED;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const fmt=h=>{const m=Math.round(h*60);return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function stats(chs){let t=0,d=0,th=0,dh=0;chs.forEach(c=>c.lec.forEach(l=>{t++;th+=l.h;if(l.d){d++;dh+=l.h}}));return{t,d,th,dh,p:t?Math.round(d/t*100):0}}
function render(){
const sub=S[cur],st=stats(sub.ch);
document.documentElement.style.setProperty("--c",sub.color);
$("tabs").innerHTML=S.map((s,i)=>`<button class="tab ${i==cur?"on":""}" style="--c:${s.color}" data-t="${i}">${esc(s.name)} · ${stats(s.ch).p}%</button>`).join("");
let h=`<div class="sum"><div class="big">${st.p}%</div><div class="mu">${st.d} of ${st.t} lectures · ${fmt(st.dh)} done · ${fmt(st.th-st.dh)} left</div><div class="bar"><i style="width:${st.p}%"></i></div><div class="mu" style="margin-top:6px">${esc(sub.teacher||"")}</div></div>`;
sub.ch.forEach((c,ci)=>{const s=stats([c]),k=cur+"-"+ci;
h+=`<div class="ch ${open[k]?"open":""} ${s.d==s.t&&s.t?"full":""}"><div class="hd" data-o="${k}"><span class="n">${c.n??"•"}</span><b>${esc(c.t)}</b><span class="ct">${s.d}/${s.t}</span></div><div class="ls">
<div class="bar" style="margin:0 0 6px"><i style="width:${s.p}%"></i></div>
<button class="s mini" data-all="${ci}">${s.d==s.t?"Clear all":"Mark all done"}</button>
${c.lec.map((l,li)=>`<label class="l ${l.d?"d":""}"><input type="checkbox" data-c="${ci}" data-l="${li}" ${l.d?"checked":""}><span>${esc(l.l)}</span><small class="mu">${fmt(l.h)}</small></label>`).join("")}
</div></div>`});
$("app").innerHTML=h}
document.addEventListener("click",e=>{
const t=e.target.closest("[data-t]");if(t){cur=+t.dataset.t;render();return}
const o=e.target.closest("[data-o]");if(o){open[o.dataset.o]=!open[o.dataset.o];render();return}
const a=e.target.closest("[data-all]");if(a){const c=S[cur].ch[+a.dataset.all],all=c.lec.every(l=>l.d);c.lec.forEach(l=>l.d=!all);save();render()}});
document.addEventListener("change",e=>{const i=e.target;if(i.dataset&&i.dataset.l!==undefined){S[cur].ch[+i.dataset.c].lec[+i.dataset.l].d=i.checked;save();render()}});
$("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="tracker-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const j=JSON.parse(x);if(!Array.isArray(j))throw 0;S=j;cur=0;save();render()}catch(_){alert("Not a valid backup file")}})};
$("rst").onclick=()=>{if(confirm("Reset all progress to the starting data?")){S=JSON.parse(JSON.stringify(SEED));save();render()}};
render();
</script></body></html>
